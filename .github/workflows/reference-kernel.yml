name: Reference Kernel + Transcendence Core

on:
  push:
    paths:
      - "runtime/reference_kernel/**"
      - "runtime/transcendence_core/**"
      - "specs/transcendence/**"
      - "docs/transcendence/**"
      - "docs/superpowers/plans/2026-09-17-hcsa-bci-continuity-core-v0.md"
      - "docs/superpowers/specs/2026-09-17-universal-open-bci-amendment.md"
      - ".github/workflows/reference-kernel.yml"
  pull_request:
    paths:
      - "runtime/reference_kernel/**"
      - "runtime/transcendence_core/**"
      - "specs/transcendence/**"
      - "docs/transcendence/**"
      - "docs/superpowers/plans/2026-09-17-hcsa-bci-continuity-core-v0.md"
      - "docs/superpowers/specs/2026-09-17-universal-open-bci-amendment.md"
      - ".github/workflows/reference-kernel.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact workflow subject
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git clone --no-checkout "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git checkout --detach "${COMMIT_SHA}"
      - name: Run inherited HC reference-kernel tests
        working-directory: repo/runtime/reference_kernel
        run: python3 -m unittest -v test_hc_kernel.py test_durable_kernel.py
      - name: Run Transcendence core tests
        working-directory: repo/runtime/transcendence_core
        run: python3 -m unittest -v test_core.py
